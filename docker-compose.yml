services:
  mysql:
    image: mysql:8.0
    container_name: absboos-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-audiobookshelf_bot}
    ports:
      - "${MYSQL_PORT:-33306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  absboss:
    image: dddddluo/absboss:latest
    container_name: absboss
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      OWNER_TG_ID: ${OWNER_TG_ID:-}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:?set ADMIN_TG_IDS in .env}
      ABS_BASE_URL: ${ABS_BASE_URL:?set ABS_BASE_URL in .env}
      ABS_API_TOKEN: ${ABS_API_TOKEN:?set ABS_API_TOKEN in .env}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: ${LOG_FILE:-logs/app.log}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      MYSQL_DSN: ${MYSQL_DSN:?set MYSQL_DSN in .env}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups

volumes:
  mysql_data:

