[project]
name = "absboss"
version = "0.1.0"
description = "Telegram user management bot for Audiobookshelf"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.28,<4",
    "aiomysql>=0.3.2,<0.4",
    "alembic>=1.18.4,<1.19",
    "apscheduler>=3.11.2,<3.12",
    "greenlet>=3.5.1,<3.6",
    "httpx>=0.28.1,<0.29",
    "python-dotenv>=1.2.2,<1.3",
    "sqlalchemy>=2.0.49,<2.1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.19,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["absbot*"]
exclude = ["tests*", "alembic*"]
